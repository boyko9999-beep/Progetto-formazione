<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prova figure</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="css/programmazione.css">
</head>
<body class="pg">
  <header class="topbar"><span>Prova figure</span><div class="progress"><span id="progress"></span><span class="progress-track"><span id="progress-bar"></span></span></div></header>
  <main id="main" class="pg-main"><div id="pg-root"></div></main>
  <script src="js/core.js"></script>
  <script>
  // Anteprima delle figure di un capitolo, anche se il capitolo non le usa ancora:
  //   _prova-figure.html?file=logica            tutte le figure registrate da js/figure/logica.js
  //   _prova-figure.html?file=logica&ids=a,b    solo quelle indicate
  // Il capitolo finto ha l'id vero, così l'accento --cap è quello giusto.
  const q = new URLSearchParams(location.search);
  const file = q.get('file') || 'telai';
  const prima = new Set(Object.keys(ProgStoria.dati().figure));
  const sc = document.createElement('script');
  sc.src = 'js/figure/' + file + '.js';
  sc.onload = sc.onerror = () => {
    const ids = q.get('ids') ? q.get('ids').split(',') : Object.keys(ProgStoria.dati().figure).filter((id) => !prima.has(id));
    ProgStoria.capitolo({
      id: file, numero: 1, anni: '1900–1901', titolo: 'Figure di ' + file, epoca: 'editor',
      intro: ids.length ? 'Figure: ' + ids.join(', ') + '.' : 'Nessuna figura registrata in js/figure/' + file + '.js.',
      blocchi: ids.map((id) => ({ tipo: 'figura', id: id, didascalia: 'Figura «' + id + '».' })),
    });
    ProgStoria.avvia();
  };
  document.body.append(sc);
  </script>
</body>
</html>
